      // "all of it": the fire doubles
      tl.to("#s1-f" + (i + 1), { scale: 1.7, duration: 0.25, ease: "back.out(2)", svgOrigin: o, overwrite: true }, T.whole - 0.05 + i * 0.04);
      tl.to("#s1-f" + (i + 1), { scaleY: 1.9, scaleX: 1.6, duration: 0.24 + i * 0.03, yoyo: true, repeat: 19, ease: "sine.inOut", svgOrigin: o }, T.whole + 0.3 + i * 0.04);

    tl.fromTo("#s1-t1b", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out" }, T.whole);

    EK.out(tl, "#s1-claim", T.emp - 0.2);
    tl.to("#s1-t1, #s1-t1b", { opacity: 0, duration: 0.15 }, T.emp - 0.2);
    EK.pop(tl, "#s1-emp", T.emp, -3);
    tl.to("#s1-ne", { y: 0, duration: 0.5, ease: "back.out(1.3)" }, T.emp - 0.1);
    tl.to("#s1-ne", { filter: "brightness(1)", duration: 0.12, ease: "power2.out" }, T.name - 0.02);
    EK.stamp(tl, "#s1-name", "#s1-stage", T.name + 0.1, -5);
    EK.mood(tl, "s1-n", T.name + 0.2, "laugh");
    EK.blink(tl, "s1-n", T.name + 0.65);

    tl.to("#s1-B", { x: 0, duration: 0.45, ease: "power3.inOut" }, T.but + 0.1);
