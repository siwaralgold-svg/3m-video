<template>
  <style>
    @font-face { font-family: "Lalezar"; src: url("assets/fonts/Lalezar-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: "Noto Kufi Arabic"; src: url("assets/fonts/NotoKufiArabic.ttf"); font-weight: 100 900; }
    @font-face { font-family: "Courier Prime"; src: url("assets/fonts/CourierPrime-Bold.ttf"); font-weight: 700; }
    #root { position: absolute; inset: 0; overflow: hidden; }
  </style>
  <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
    <div id="s1-wrap" class="clip" data-start="0" data-duration="16.15" data-layout-allow-overflow style="position:absolute;inset:0">
      <div id="s1-stage" class="stage">
        <svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
          <!-- the division: bounced cheques over Kuwaitis -->
          <g id="s1-pile"><g id="s1-pile-slot" transform="translate(790,290)"></g></g>
          <g id="s1-ppl"><g id="s1-ppl-slot" transform="translate(290,372)"></g></g>
          <!-- the family -->
          <g id="s1-m1"><g id="s1-m1-slot" transform="translate(850,1180) scale(0.85)"></g></g>
          <g id="s1-m2"><g id="s1-m2-slot" transform="translate(630,1180) scale(0.85)"></g></g>
          <g id="s1-m3"><g id="s1-m3-slot" transform="translate(410,1180) scale(0.62)"></g></g>
          <g id="s1-m4"><g id="s1-m4-slot" transform="translate(215,1180) scale(0.42)"></g></g>
        </svg>
        <div id="s1-div" class="num" style="top:205px; font-size:170px; line-height:170px">÷</div>
        <div id="s1-c1" class="card" style="left:610px; top:392px; width:370px; height:66px; font-size:34px; line-height:50px">الشيكات اللي ارتدت</div>
        <div id="s1-c2" class="card" style="left:170px; top:392px; width:240px; height:66px; font-size:34px; line-height:50px">الكويتيين</div>
        <div id="s1-numbox" class="num" style="top:468px; font-size:176px; line-height:196px"><span id="s1-num" style="display:inline-block; position:relative"><span id="s1-minus" style="position:absolute; right:100%; top:0">-</span>$<span id="s1-val">0</span></span></div>
        <div id="s1-lbl" class="kufi" style="position:absolute; left:0; width:1080px; top:662px; text-align:center; font-weight:800; font-size:44px; line-height:66px; color:#23261A">نصيب كل مواطن</div>
        <div id="s1-t1" class="card mono" style="left:755px; top:742px; width:190px; height:60px; font-size:32px; line-height:48px"><span class="s1-neg">-</span>$90,000</div>
        <div id="s1-t2" class="card mono" style="left:535px; top:756px; width:190px; height:60px; font-size:32px; line-height:48px"><span class="s1-neg">-</span>$90,000</div>
        <div id="s1-t3" class="card mono" style="left:315px; top:862px; width:190px; height:60px; font-size:32px; line-height:48px"><span class="s1-neg">-</span>$90,000</div>
        <div id="s1-t4" class="card mono" style="left:120px; top:936px; width:190px; height:60px; font-size:32px; line-height:48px"><span class="s1-neg">-</span>$90,000</div>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const R = MK.RED, INK = MK.INK;
    // three bounced cheques, each with a small red mark
    const mark = `<rect x="-60" y="2" width="86" height="40" rx="6" fill="none" stroke="${R}" stroke-width="7" transform="rotate(-10)"/>`;
    MK.fill("s1-pile-slot", `<g transform="translate(-40,34) rotate(-12) scale(0.85)">${MK.cheque("s1-pa", mark)}</g><g transform="translate(46,10) rotate(9) scale(0.85)">${MK.cheque("s1-pb", mark)}</g><g transform="translate(0,-26) rotate(-3) scale(0.85)">${MK.cheque("s1-pc", mark)}</g>`);
    let ppl = ""; for (let i = 0; i < 5; i++) ppl += `<g transform="translate(${(i - 2) * 66},0) scale(0.3)">${MK.man("s1-pp" + i)}</g>`;
    MK.fill("s1-ppl-slot", ppl);
    MK.fill("s1-m1-slot", MK.man("s1-dad")); MK.fill("s1-m2-slot", MK.woman("s1-mum"));
    MK.fill("s1-m3-slot", MK.kid("s1-boy")); MK.fill("s1-m4-slot", MK.kid("s1-tot"));
    const T = { num: 0.06, share: 2.11, dad: 2.55, mum: 2.78, boy: 3.33, tot: 4.42, minus: 5.47, split: 6.96, cheques: 7.34, kuw: 9.61, scared: 10.57, joke: 12.42, story: 13.88, real: 15.62 };
    const fam = ["#s1-m1", "#s1-m2", "#s1-m3", "#s1-m4"], tags = ["#s1-t1", "#s1-t2", "#s1-t3", "#s1-t4"], feet = ["850 1180", "630 1180", "410 1180", "215 1180"];
    gsap.set("#s1-c1, #s1-c2, #s1-lbl, #s1-minus, " + tags.join(","), { opacity: 0 }); gsap.set(".s1-neg", { display: "none" });
    fam.forEach((f, i) => MK.pivot(f, feet[i])); MK.pivot("#s1-pile", "790 290"); MK.pivot("#s1-ppl", "290 320");
    gsap.set(fam.join(","), { opacity: 0 });
    // ninety thousand dollars: the counter runs under the division
    tl.fromTo("#s1-pile", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0);
    tl.fromTo("#s1-ppl", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.05);
    MK.count(tl, "#s1-val", 0, 90000, T.num, 1.25);
    tl.fromTo("#s1-num", { scale: 1 }, { scale: 1.12, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.num + 1.25);
    // every citizen's share, even the child
    tl.fromTo("#s1-lbl", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, T.share);
    [T.dad, T.mum, T.boy, T.tot].forEach((t, i) => {
      tl.fromTo(fam[i], { opacity: 0, scaleY: 0.3 }, { opacity: 1, scaleY: 1, duration: 0.32, ease: "back.out(2.2)"}, t);
      MK.pop(tl, tags[i], t + 0.14, i % 2 ? 3 : -3);
    });
    tl.fromTo("#s1-m4", { y: 0 }, { y: -46, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.tot + 0.4);
    // ...but in the minus
    tl.set("#s1-numbox", { color: R }, T.minus);
    tl.set(tags.join(","), { color: R, borderColor: R }, T.minus + 0.12);
    tl.set(".s1-neg", { display: "inline" }, T.minus + 0.12);
    MK.stamp(tl, "#s1-minus", "#s1-stage", T.minus, 0);
    tags.forEach((s, i) => tl.fromTo(s, { scale: 1 }, { scale: 1.25, duration: 0.09, yoyo: true, repeat: 1, immediateRender: false }, T.minus + 0.12 + i * 0.05));
    fam.forEach((s, i) => tl.fromTo(s, { y: 0 }, { y: -22, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.minus + 0.05 + i * 0.04));
    // if we split the bounced cheques over the Kuwaitis
    tl.fromTo("#s1-div", { scale: 1 }, { scale: 1.5, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.split);
    tl.fromTo("#s1-pile", { rotation: 0 }, { rotation: -7, duration: 0.1, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, T.cheques);
    MK.pop(tl, "#s1-c1", T.cheques + 0.05, -3);
    tl.fromTo("#s1-ppl", { y: 0 }, { y: -18, duration: 0.11, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.kuw);
    MK.pop(tl, "#s1-c2", T.kuw + 0.05, 3);
    // why so scared? I'm joking: the number winks away
    fam.forEach((s, i) => tl.fromTo(s, { x: 0 }, { x: 7, duration: 0.05, yoyo: true, repeat: 9, ease: "none", immediateRender: false }, T.scared + 0.1 + i * 0.03));
    tl.to("#s1-num", { scaleY: 0.05, duration: 0.12, ease: "power2.in" }, T.joke);
    tl.to("#s1-num", { opacity: 0, duration: 0.05 }, T.joke + 0.12);
    tl.to(tags.join(",") + ", #s1-lbl, #s1-c1, #s1-c2", { opacity: 0, scale: 0.6, duration: 0.2, ease: "power2.in" }, T.joke + 0.05);
    fam.forEach((s, i) => tl.fromTo(s, { y: 0 }, { y: -30, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.joke + 0.35 + i * 0.08));
    // but the story itself is no joke: it comes back in red
    tl.fromTo("#s1-pile", { scale: 1 }, { scale: 1.12, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, T.story);
    tl.set("#s1-num", { scaleY: 1 }, T.real - 0.2);
    MK.stamp(tl, "#s1-num", "#s1-stage", T.real, -3, true);
    tags.forEach((s, i) => MK.pop(tl, s, T.real + 0.08 + i * 0.05, i % 2 ? 3 : -3, true));
    window.__timelines["s1"] = tl;
  </script>
</template>
