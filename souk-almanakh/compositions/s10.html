<template>
  <style>
    @font-face { font-family: "Lalezar"; src: url("assets/fonts/Lalezar-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: "Noto Kufi Arabic"; src: url("assets/fonts/NotoKufiArabic.ttf"); font-weight: 100 900; }
    @font-face { font-family: "Courier Prime"; src: url("assets/fonts/CourierPrime-Bold.ttf"); font-weight: 700; }
    #root { position: absolute; inset: 0; overflow: hidden; }
  </style>
  <div id="root" data-composition-id="s10" data-width="1080" data-height="1920">
    <div id="s10-wrap" class="clip" data-start="0" data-duration="2.4" data-layout-allow-overflow style="position:absolute;inset:0">
      <div id="s10-stage" class="stage">
        <svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
          <g id="s10-chq-slot" transform="translate(540,450) rotate(-3) scale(2.8)"></g>
          <g id="s10-lines"></g><g id="s10-nodes"></g>
        </svg>
        <div id="s10-st" class="rajea" style="left:290px; top:320px; width:500px; height:260px; font-size:200px; line-height:232px; border-width:14px">راجع</div>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const G = 64.1, t = (g) => g - G;
    MK.fill("s10-chq-slot", MK.cheque("s10-c"));
    const N = 6, CX = 540, CY = 930, RAD = 190, P = [];
    for (let k = 0; k < N; k++) { const a = (-90 + k * 60) * Math.PI / 180; P.push([CX + RAD * Math.cos(a), CY + RAD * Math.sin(a)]); }
    let nodes = "", lines = ""; const ids = [];
    P.forEach((p, k) => { nodes += `<g id="s10-n${k}"><g transform="translate(${p[0]},${p[1] + 56}) scale(0.27)">${MK.man("s10-m" + k)}</g></g>`; });
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      lines += `<path id="s10-l-${i}-${j}" d="M${P[i][0]} ${P[i][1]} L${P[j][0]} ${P[j][1]}" stroke="#5B6236" stroke-width="7" stroke-linecap="round" fill="none"/>`;
      ids.push(`#s10-l-${i}-${j}`);
    }
    MK.fill("s10-lines", lines); MK.fill("s10-nodes", nodes);
    // half a second of nothing, then the red stamp: bounced
    MK.stamp(tl, "#s10-st", "#s10-stage", t(64.68), -12);
    // and the web snaps, thread after thread
    const order = [0, 7, 3, 12, 5, 9, 1, 14, 6, 10, 2, 13, 4, 11, 8];
    order.forEach((ix, n) => {
      const el = document.querySelector(ids[ix]), L = el.getTotalLength(), at = t(65.12) + n * 0.085;
      el.style.strokeDasharray = L;
      tl.set(el, { stroke: "#C23B2B" }, at);
      tl.to(el, { strokeDashoffset: L, duration: 0.16, ease: "power2.in" }, at + 0.03);
    });
    P.forEach((p, k) => tl.to("#s10-n" + k, { y: 16, opacity: 0.45, duration: 0.25, ease: "power2.out" }, t(65.5) + k * 0.14));
    window.__timelines["s10"] = tl;
  </script>
</template>
