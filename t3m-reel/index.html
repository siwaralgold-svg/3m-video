<!doctype html>
<html
  lang="ar"
  dir="rtl"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"hookLine","type":"string","label":"Hook line 1","default":"بدون ولا درهم"},
    {"id":"hookWord","type":"string","label":"Hook word 2","default":"إعلانات"},
    {"id":"counterLabel","type":"string","label":"Counter label","default":"مشاهدة عضوية"},
    {"id":"clients","type":"string","label":"Clients line","default":"عميل"},
    {"id":"email","type":"string","label":"Email","default":"info@t3m.org"},
    {"id":"navy","type":"color","label":"Navy","default":"#1C385A"},
    {"id":"gold","type":"color","label":"Gold","default":"#CEA532"},
    {"id":"light","type":"color","label":"Light","default":"#F4F6F9"},
    {"id":"deep","type":"color","label":"Deep navy","default":"#13294B"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
    @font-face { font-family: "Cairo"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/cairo-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Cairo"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/cairo-arabic-400-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+200C-200E, U+2010-2011, U+FB50-FDFF, U+FE70-FEFC; }
    @font-face { font-family: "Cairo"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/cairo-latin-700-normal.woff2") format("woff2"); }
    @font-face { font-family: "Cairo"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/cairo-arabic-700-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+200C-200E, U+2010-2011, U+FB50-FDFF, U+FE70-FEFC; }
    @font-face { font-family: "Cairo"; font-weight: 900; font-style: normal; font-display: block; src: url("assets/fonts/cairo-latin-900-normal.woff2") format("woff2"); }
    @font-face { font-family: "Cairo"; font-weight: 900; font-style: normal; font-display: block; src: url("assets/fonts/cairo-arabic-900-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+200C-200E, U+2010-2011, U+FB50-FDFF, U+FE70-FEFC; }
      :root {
        --navy: #1c385a;
        --gold: #cea532;
        --light: #f4f6f9;
        --deep: #13294b;
        --font-display: "Cairo", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--deep);
      }
      #root { font-family: var(--font-display); }
      #bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(90% 55% at 50% 38%, #24477a 0%, rgba(36, 71, 122, 0) 70%),
          linear-gradient(180deg, #1c385a 0%, #13294b 60%, #0e2140 100%);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-wtrm" id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div data-hf-id="hf-ki9u" id="bg" class="clip" data-start="0" data-duration="20" data-track-index="0" data-layout-ignore style="z-index: 1"></div>

      <div data-hf-id="hf-ztbm" id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div data-hf-id="hf-40jd" id="counter" data-composition-id="counter" data-composition-src="compositions/counter.html"
        data-start="3" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div data-hf-id="hf-re7g" id="chart" data-composition-id="chart" data-composition-src="compositions/chart.html"
        data-start="7" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div data-hf-id="hf-bor1" id="map" data-composition-id="map" data-composition-src="compositions/map.html"
        data-start="12" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div data-hf-id="hf-xsnw" id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="16" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <div data-hf-id="hf-2xox" id="cuts" data-composition-id="cuts" data-composition-src="compositions/cuts.html"
        data-start="0" data-duration="20" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>

      <!-- Sound: a whoosh on every cut (3, 7, 12, 16 s), hits on the landings. Peaks land one frame after the picture. -->
      <audio data-hf-id="hf-z0a9" id="sfx-hook-slam" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="1.06" data-duration="2.1" data-track-index="10" data-volume="0.55"></audio>
      <audio data-hf-id="hf-55sn" id="sfx-cut-1" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.87" data-duration="0.57" data-track-index="11" data-volume="0.58"></audio>
      <audio data-hf-id="hf-klw5" id="sfx-count-land" class="clip" src="assets/sfx/ping.mp3" data-start="4.56" data-duration="1.3" data-track-index="10" data-volume="0.47"></audio>
      <audio data-hf-id="hf-v2kt" id="sfx-cut-2" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="6.43" data-media-start="1.9" data-duration="1.6" data-track-index="11" data-volume="0.47" data-fade-out="0.4"></audio>
      <audio data-hf-id="hf-ussx" id="sfx-chart-callout" class="clip" src="assets/sfx/pop.mp3" data-start="9.26" data-duration="0.7" data-track-index="10" data-volume="0.43"></audio>
      <audio data-hf-id="hf-lvtb" id="sfx-cut-3" class="clip" src="assets/sfx/whoosh.mp3" data-start="11.843" data-playback-rate="0.85" data-duration="0.67" data-track-index="11" data-volume="0.58"></audio>
      <audio data-hf-id="hf-51mt" id="sfx-pin-1" class="clip" src="assets/sfx/pop.mp3" data-start="12.363" data-duration="0.7" data-track-index="12" data-volume="0.27"></audio>
      <audio data-hf-id="hf-tq21" id="sfx-pin-2" class="clip" src="assets/sfx/click-soft.mp3" data-start="12.76" data-duration="0.36" data-track-index="13" data-volume="0.35"></audio>
      <audio data-hf-id="hf-wjm9" id="sfx-pin-3" class="clip" src="assets/sfx/pop.mp3" data-start="13.063" data-duration="0.7" data-track-index="12" data-volume="0.27"></audio>
      <audio data-hf-id="hf-azth" id="sfx-pin-4" class="clip" src="assets/sfx/click-soft.mp3" data-start="13.46" data-duration="0.36" data-track-index="13" data-volume="0.35"></audio>
      <audio data-hf-id="hf-v9oa" id="sfx-pin-5" class="clip" src="assets/sfx/pop.mp3" data-start="13.763" data-duration="0.7" data-track-index="12" data-volume="0.27"></audio>
      <audio data-hf-id="hf-pcyg" id="sfx-logo-swell" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="15.297" data-duration="2.58" data-track-index="10" data-volume="0.58"></audio>
      <audio data-hf-id="hf-tyin" id="sfx-cut-4" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="15.43" data-media-start="1.9" data-duration="1.6" data-track-index="11" data-volume="0.47" data-fade-out="0.4"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
