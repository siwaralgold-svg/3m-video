<!-- Counter, built on the registry's count-up primitive: authored per-frame value rows (seek-safe),
     sine.inOut count, tabular figures, one landing pulse. The full figure then collapses into "1B+". -->
<template>
  <style>
    @font-face { font-family: "Cairo"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/cairo-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Cairo"; font-weight: 400; font-style: normal; font-display: block; src: url("assets/fonts/cairo-arabic-400-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+200C-200E, U+2010-2011, U+FB50-FDFF, U+FE70-FEFC; }
    @font-face { font-family: "Cairo"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/cairo-latin-700-normal.woff2") format("woff2"); }
    @font-face { font-family: "Cairo"; font-weight: 700; font-style: normal; font-display: block; src: url("assets/fonts/cairo-arabic-700-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+200C-200E, U+2010-2011, U+FB50-FDFF, U+FE70-FEFC; }
    @font-face { font-family: "Cairo"; font-weight: 900; font-style: normal; font-display: block; src: url("assets/fonts/cairo-latin-900-normal.woff2") format("woff2"); }
    @font-face { font-family: "Cairo"; font-weight: 900; font-style: normal; font-display: block; src: url("assets/fonts/cairo-arabic-900-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+200C-200E, U+2010-2011, U+FB50-FDFF, U+FE70-FEFC; }
    #root { position: absolute; inset: 0; font-family: "Cairo", sans-serif; color: var(--light, #f4f6f9); }
    #counter-stage { position: absolute; left: 60px; right: 60px; top: 380px; height: 900px; }
    #counter-glow { position: absolute; left: 50%; top: 330px; width: 900px; height: 900px; margin-left: -450px; margin-top: -450px; border-radius: 50%;
      background: radial-gradient(circle, rgba(206,165,50,.34) 0%, rgba(206,165,50,0) 62%); }
    #counter-run { position: absolute; left: 0; right: 0; top: 240px; text-align: center; direction: ltr;
      font-weight: 700; font-size: 126px; line-height: 1.2; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; white-space: nowrap; }
    #counter-big { position: absolute; left: 0; right: 0; top: 70px; text-align: center; direction: ltr;
      font-weight: 900; font-size: 400px; line-height: 1.1; color: var(--gold, #cea532); white-space: nowrap; }
    #counter-plus { font-size: 0.62em; vertical-align: 0.42em; margin-left: 0.04em; }
    #counter-label { position: absolute; left: 0; right: 0; top: 610px; text-align: center; direction: rtl;
      font-weight: 700; font-size: 104px; line-height: 1.3; }
    #counter-rule { position: absolute; left: 50%; top: 585px; width: 260px; height: 8px; margin-left: -130px; border-radius: 4px; background: var(--gold, #cea532); }
  </style>
  <div data-hf-id="hf-yhil" id="root" data-composition-id="counter" data-width="1080" data-height="1920">
    <div data-hf-id="hf-9w9n" id="counter-stage" class="clip" data-start="0" data-duration="4" data-layout-allow-overlap>
      <div data-hf-id="hf-sc4y" id="counter-glow" data-layout-ignore></div>
      <div data-hf-id="hf-sfrt" id="counter-run">0</div>
      <div data-hf-id="hf-wnxp" id="counter-big">1B<span data-hf-id="hf-0m9o" id="counter-plus">+</span></div>
      <div data-hf-id="hf-bs8u" id="counter-rule"></div>
      <div data-hf-id="hf-63he" id="counter-label" data-var-text="counterLabel">مشاهدة عضوية</div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const FPS = 30, START = 0.2, COUNT = 1.5, END = 1000000000;
      const run = document.querySelector('[data-composition-id="counter"] #counter-run');
      const ease = gsap.parseEase("sine.inOut");
      const last = Math.round(COUNT * FPS);
      const fmt = (v) => Math.round(v).toLocaleString("en-US"); // Western digits only

      tl.fromTo("#counter-run", { opacity: 0, y: 30, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power3.out" }, START);
      for (let f = 0; f <= last; f++) {
        tl.set(run, { textContent: fmt(END * ease(f / last)) }, START + COUNT * (f / last));
      }
      // Landing pulse on the exact figure.
      tl.to("#counter-run", { scale: 1.07, duration: 0.12, ease: "power3.out" }, START + COUNT);
      // Collapse the long figure, slam "1B+" (ping lands at 1.85 s).
      tl.to("#counter-run", { scale: 0.6, opacity: 0, y: 40, duration: 0.18, ease: "power2.in" }, 1.82);
      tl.fromTo("#counter-big", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "expo.out" }, 1.82);
      tl.fromTo("#counter-glow", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 1.82);
      tl.fromTo("#counter-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 2.05);
      tl.fromTo("#counter-label", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.1);
      // Hold: subtle drift.
      tl.fromTo("#counter-big", { y: 0 }, { y: -10, duration: 1.6, ease: "sine.inOut" }, 2.2);
      window.__timelines["counter"] = tl;
    })();
  </script>
</template>
