<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"headline","type":"string","label":"Headline","default":"Test render"},{"id":"accent","type":"color","label":"Accent","default":"#ff5a36"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0e0f13;
        --ink: #f4f1ea;
        --accent: #ff5a36;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 70% at 50% 40%, #1c1f29 0%, var(--ground) 70%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="10" data-track-index="0" data-layout-ignore></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="specs" data-composition-id="specs" data-composition-src="compositions/specs.html"
        data-start="3.5" data-duration="3.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="7" data-duration="3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:2"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
