  <script>
    // the open-air court: the beheaded pyramids behind, a stone table in front
    EK.fill("s12-bg", EK.desert()); EK.fill("s12-table", EK.table(1070));
    EK.fill("s12-pyrs", [[150, 1090, 230, 420, 8], [930, 1090, 250, 450, 8]].map(([cx, base, pw, ph, n], i) => EK.pyr("s12-p" + i, cx, base, pw, ph, n)).join(""));
    [0, 1].forEach((i) => [5, 6, 7].forEach((r) => document.getElementById(`s12-p${i}-r${r}`).remove()));

    const w = EK.clock("s12");

    const tl = gsap.timeline({ paused: true });

    EK.blink(tl, "s12-fe", T.b + 1.1);
    // the verdict is yours: the gavel comes up, and falls on "you"
    tl.to("#s12-a, #s12-b", { opacity: 0, duration: 0.14 }, T.verdict - 0.1);
    EK.look(tl, "s12-fe", T.verdict, 9, 2);
    tl.to("#s12-gavel-in", { rotation: 44, duration: 0.5, ease: "power2.out" }, T.verdict);
