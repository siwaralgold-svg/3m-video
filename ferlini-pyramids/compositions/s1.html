<template>
  <style>
    @font-face { font-family: "Lalezar"; src: url("assets/fonts/Lalezar-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: "Noto Kufi Arabic"; src: url("assets/fonts/NotoKufiArabic.ttf"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; overflow: hidden; }
  </style>
  <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
    <div id="s1-wrap" class="clip" data-start="0" data-duration="14.1" data-layout-allow-overflow style="position:absolute;inset:0">
      <div id="s1-stage" class="stage">
        <svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg" style="position:absolute;left:0;top:0">
          <defs><clipPath id="s1-clip"><rect x="-200" y="0" width="1480" height="1163"/></clipPath></defs>
          <g id="s1-bg"></g>
          <g id="s1-pyrs"></g>
          <g clip-path="url(#s1-clip)"><g id="s1-fegrp"><g id="s1-fe-slot" transform="translate(540,930) scale(1.5)"></g></g></g>
          <g id="s1-sand"></g>
        </svg>
        <div id="s1-name" class="disp" style="position:absolute; left:20px; right:20px; top:176px; text-align:center; font-size:200px; line-height:1.2; color:#F4F6F9">السودان</div>
        <div id="s1-more" class="card disp" style="left:210px; top:416px; width:660px; height:124px; font-size:92px; line-height:128px">أكثر من مصر</div>
        <div id="s1-cnt" class="count">أكثر من</div>
        <div id="s1-num" class="ttl" style="font-size:200px; top:226px">٢٠٠ هرم</div>
        <div id="s1-kush" class="sign" style="left:240px; top:440px; width:600px; height:120px; font-size:88px; line-height:122px">مملكة كوش</div>
        <div id="s1-nohead" class="card disp" style="left:200px; top:190px; width:680px; height:176px; font-size:132px; line-height:184px">بدون راس</div>
        <div id="s1-doc" class="card disp" style="left:210px; top:190px; width:660px; height:160px; font-size:116px; line-height:166px">طبيب إيطالي</div>
        <div id="s1-fname" class="plate" style="left:130px; top:196px; width:820px; height:200px; font-size:142px; line-height:190px">جوزيبي فيرليني</div>
      </div>
    </div>
  </div>
  <script>
    // six pyramids of Meroe: three small ones behind, three big ones in front
    const P1 = [["a", 330, 1050, 150, 270, 6], ["b", 660, 1050, 160, 300, 6], ["c", 960, 1050, 140, 250, 6], ["d", 180, 1110, 240, 430, 8], ["e", 500, 1120, 300, 560, 9], ["f", 840, 1110, 260, 470, 8]];
    EK.fill("s1-bg", EK.desert()); EK.fill("s1-sand", EK.sand());
    EK.fill("s1-pyrs", P1.map(([k, cx, base, pw, ph, n]) => `<g id="s1-p${k}">${EK.pyr("s1-p" + k, cx, base, pw, ph, n)}${pw > 200 ? EK.chapel(cx, base + 4, pw / 300) : ""}</g>`).join(""));
    EK.put("s1-fe-slot", "s1-fe", "ferlini");
    const w = EK.clock("s1");
    const T = { pyr: w(2), more: w(3), cnt: w(6), num: w(8), kush: w(11), many: w(13), cut: w(16), head: w(17), who: w(18), doc: w(21), name: w(24, 0.3) };
    const tl = gsap.timeline({ paused: true });
    EK.face(tl, "s1-fe", "smug");
    gsap.set("#s1-more, #s1-cnt, #s1-num, #s1-kush, #s1-nohead, #s1-doc, #s1-fname", { opacity: 0 });
    gsap.set("#s1-fegrp", { y: 950 });
    // the country's name is there on frame 0 and lands; the pyramids come up behind the dune
    tl.fromTo("#s1-name", { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "power4.out" }, 0);
    P1.forEach(([k], i) => tl.fromTo("#s1-p" + k, { y: 760 }, { y: 0, duration: 0.5, ease: "back.out(1.3)" }, T.pyr - 0.25 + i * 0.08));
    EK.pop(tl, "#s1-more", T.more, -3);
    // more than two hundred
    tl.to("#s1-name, #s1-more", { opacity: 0, duration: 0.12 }, T.cnt - 0.12);
    tl.fromTo("#s1-cnt", { opacity: 0 }, { opacity: 1, duration: 0.15 }, T.cnt);
    tl.fromTo("#s1-num", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.out" }, T.num - 0.1);
    EK.shake(tl, "#s1-stage", T.num + 0.12, 6);
    EK.pop(tl, "#s1-kush", T.kush, 3);
    // many of them have no top today: the caps are sliced off one pyramid after another
    tl.to("#s1-cnt, #s1-num, #s1-kush", { opacity: 0, duration: 0.14 }, T.many + 0.1);
    P1.forEach(([k, cx, base, pw, ph, n], i) => {
      const t = T.cut + i * 0.17, dir = i % 2 ? 1 : -1, cut = pw > 200 ? 3 : 2;
      for (let r = n - cut; r < n; r++) {
        tl.to(`#s1-p${k}-r${r}`, { x: dir * (160 + r * 12), y: -260, rotation: dir * 50, duration: 0.42, ease: "power2.out", transformOrigin: "50% 50%" }, t);
        tl.to(`#s1-p${k}-r${r}`, { opacity: 0, duration: 0.12 }, t + 0.3);
      }
      tl.fromTo("#s1-p" + k, { y: 0 }, { y: 9, duration: 0.06, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t);
    });
    EK.pop(tl, "#s1-nohead", T.head, -4);
    // and the one who cut them: he rises in front of the stumps
    tl.to("#s1-fegrp", { y: 0, duration: 0.5, ease: "back.out(1.3)" }, T.who + 0.2);
    EK.out(tl, "#s1-nohead", T.doc);
    EK.pop(tl, "#s1-doc", T.doc, 4);
    EK.blink(tl, "s1-fe", T.doc + 0.5);
    EK.look(tl, "s1-fe", T.doc + 0.2, 0, -8);
    EK.out(tl, "#s1-doc", T.name - 0.2);
    EK.stamp(tl, "#s1-fname", "#s1-stage", T.name, -4);
    EK.mood(tl, "s1-fe", T.name + 0.05, "laugh");
    EK.idle(tl, "s1-fe", T.who + 0.8, DT.D.s1 - 0.05, 2.4);
    window.__timelines["s1"] = tl;
  </script>
</template>
