function palmWork(fa, tStop) {
  const ph = 0.5 * CYC - (tStop % CYC);             // he ends hooked in, at the top of a stroke
  const stroke = (t) => { const c = ((t + ph) % CYC) / CYC;

  return {state, hits};

    e.style.transform = `translate(${x}px, ${y}px) rotate(${(r1 - 0.5) * 700 * a + 40 * i}deg)`; } });
